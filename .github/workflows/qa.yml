name: Driver 2 — QA de lógica
on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/qa.yml'
  pull_request:
    paths:
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Testar lógica sem dependências externas
        run: node --test tests/*.test.cjs
