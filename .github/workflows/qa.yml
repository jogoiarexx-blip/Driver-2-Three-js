name: Driver 2 — QA de lógica
on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar lógica sem dependências externas
        run: node --test tests/*.test.cjs
