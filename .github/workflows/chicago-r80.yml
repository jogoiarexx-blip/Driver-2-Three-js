name: Chicago R80 - River banks, fixed bridges and lift-safe traffic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/world/chicago-riverfront-r80.js'
      - 'js/world/city-builder.js'
      - 'index.html'
      - 'tests/chicago-r80-*.cjs'
      - '.github/workflows/chicago-r80.yml'
      - 'CHICAGO_CONTINUIDADE_R78.md'
  push:
    branches: [main]
    paths:
      - 'js/world/chicago-riverfront-r80.js'
      - 'js/world/city-builder.js'
      - 'index.html'
      - 'tests/chicago-r80-*.cjs'
permissions:
  contents: read
jobs:
  real-riverfront-bridges:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and river physics, bridge and Chicago regressions
        run: |
          node --check js/world/chicago-riverfront-r80.js
          node --check js/world/city-builder.js
          node --test tests/chicago-r80-riverfront.test.cjs tests/chicago-ps1-river-branches.test.cjs tests/chicago-r53-west-canal.test.cjs tests/chicago-r79-downtown-streets.test.cjs tests/chicago-r78-sequential-blocks.test.cjs tests/chicago-r69-courtyard-network.test.cjs tests/chicago-r77-playable-landmarks.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve actual Driver 2
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/r80-http.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/r80-http.log
          exit 1
      - name: Verify actual Chicago, R80 rail AABB, fixed and moving bridge routes
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r80-riverfront-browser.cjs
      - name: Upload real in-game screenshot and collision audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-r80-live-riverfront-bridges
          path: qa-artifacts/chicago-r80/
          if-no-files-found: warn
