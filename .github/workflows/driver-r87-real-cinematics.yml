name: Driver R87 - real live actors, mission intros and Jones pose
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/gameplay/mission-shots-r87.js'
      - 'js/gameplay/mission-briefing.js'
      - 'js/gameplay/campaign-scenes-r86.js'
      - 'js/engine/driver2-game-engine.js'
      - 'index.html'
      - 'tests/driver-r87-*.cjs'
      - 'tests/driver-r86-*.cjs'
      - '.github/workflows/driver-r87-real-cinematics.yml'
      - 'CHICAGO_CONTINUIDADE_R78.md'
  push:
    branches: [main]
    paths:
      - 'js/gameplay/mission-shots-r87.js'
      - 'js/gameplay/mission-briefing.js'
      - 'js/engine/driver2-game-engine.js'
      - 'tests/driver-r87-*.cjs'
permissions:
  contents: read
jobs:
  real-actors-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R87 scripts, real actors, mission continuity and R85/R86 regressions
        run: |
          node --check js/gameplay/mission-shots-r87.js
          node --check js/gameplay/mission-briefing.js
          node --check js/engine/driver2-game-engine.js
          node --test tests/driver-r87-real-actors.test.cjs tests/driver-r86-campaign-scenes.test.cjs tests/driver-natural-campaign-hud.test.cjs tests/chicago-mission-completion.smoke.cjs tests/chicago-mission-guidance.smoke.cjs tests/chicago-mission-guidance-ui.smoke.cjs tests/chicago-chapters.test.cjs tests/chicago-leaving.test.cjs tests/chicago-caine.test.cjs tests/chicago-intruder.test.cjs tests/havana-lead.test.cjs tests/arcade-regional-expansion.test.cjs tests/driver-r58-vehicle-animations.test.cjs tests/chicago-r85-door-sweep.test.cjs tests/chicago-r84-vertical-interiors.test.cjs tests/city-home-save.test.cjs
          node tests/chicago-mission-ui.smoke.cjs
      - name: Install Chromium software WebGL
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve real playable game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/driver-r87-http.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/driver-r87-http.log
          exit 1
      - name: Existing R86 story stage, victory and intro browser regression
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/driver-r86-scenes-browser.cjs
      - name: Real Tanner and station Jones actor framing with screenshots
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/driver-r87-real-actors-browser.cjs
      - name: Archive live game evidence and QA camera
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-r87-real-actor-shots
          path: |
            qa-artifacts/r86-campaign-scenes/
            qa-artifacts/r87-live-cinematics/
          if-no-files-found: warn
