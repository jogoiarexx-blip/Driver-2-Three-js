name: Driver 2 - QA visual das quatro cidades

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'tests/chicago-ps1-undercover-visual.cjs'
      - 'tests/chicago-ps1-undercover-river-r2-visual.cjs'
      - 'js/world/chicago-ps1-river-branches.js'
      - 'js/world/road-surface.js'
      - 'js/world/street-furniture.js'
      - 'tests/chicago-r3-streets-browser.cjs'
      - 'tests/chicago-r4-island-browser.cjs'
      - 'tests/chicago-r5-visitor-browser.cjs'
      - 'tests/chicago-r6-north-yard-browser.cjs'
      - 'tests/chicago-r7-real-driving-replay.cjs'
      - 'tests/chicago-r22-*'
      - 'tests/chicago-r23-*'
      - 'tests/chicago-r25-*'
      - 'tests/chicago-r7-junctions-browser.cjs'
      - 'js/world/chicago-goose-island-junctions.js'
      - 'js/world/chicago-goose-island-north-yard.js'
      - 'js/world/chicago-goose-island-street.js'
      - 'js/world/chicago-ps1-coastline.js'
      - 'chicago/**'
      - 'chicago-original-preview.html'
      - 'tests/chicago-root-preview-visual.cjs'
      - 'js/world/**'
      - 'tests/visual-smoke.cjs'
      - 'tests/chicago-overhaul.test.cjs'
      - 'tests/chicago-neighborhoods.test.cjs'
      - 'tests/rio-overhaul.test.cjs'
      - 'tests/havana-overhaul.test.cjs'
      - 'tests/vegas-overhaul.test.cjs'
      - 'tests/district-visibility.test.cjs'
      - 'tests/arcade-regional-expansion.test.cjs'
      - 'tests/expansion-visual-smoke.cjs'
      - 'js/gameplay/driving-games-classic.js'
      - 'js/gameplay/regional-missions.js'
      - 'js/gameplay/mission-briefing.js'
      - 'js/world/spatial-collision-grid.js'
      - 'tests/road-surface-style.test.cjs'
      - 'js/world/road-surface.js'
      - 'js/render/ps1-texture-factory.js'
      - 'js/world/street-furniture.js'
      - 'js/data/city-presets.js'
      - 'js/world/chicago-train.js'
      - 'tests/structure-smoke.cjs'
      - 'tests/female-walker-smoke.cjs'
      - 'tests/male-pedestrian-glb.test.cjs'
      - 'tests/male-pedestrian-visual.cjs'
      - 'js/assets/driver-male-pedestrian.js'
      - 'tests/pedestrian-curb-smoke.cjs'
      - 'js/entities/pedestrian-sidewalk-nav.js'
      - 'js/vehicles/driver-vehicle.js'
      - 'js/vehicles/police-door-rig.js'
      - 'js/engine/gpu-resources.js'
      - 'tests/gpu-resource-lifecycle.test.cjs'
      - 'js/assets/driver-female-pedestrian.js'
      - 'js/assets/driver-pedestrian-variants.js'
      - 'js/entities/pedestrians-roadblocks.js'
      - 'assets/pedestrians/**'
      - '.github/workflows/visual-qa.yml'

permissions:
  contents: read

jobs:
  four-city-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Certificar Chicago 2.0 e isolamento entre cidades
        run: node tests/chicago-overhaul.test.cjs
      - name: Certificar Rio 2.0, orla, Corcovado e isolamento
        run: node --test tests/rio-overhaul.test.cjs
      - name: Certificar Havana 2.0, Malecón, porto e isolamento
        run: node --test tests/havana-overhaul.test.cjs
      - name: Certificar Vegas 2.0, Strip, cassinos e isolamento
        run: node --test tests/vegas-overhaul.test.cjs
      - name: Certificar bairros, placas e píer visual de Chicago
        run: node --test tests/chicago-neighborhoods.test.cjs
      - name: Certificar fachadas PS1 encaixadas nos lotes de Chicago
        run: node --test tests/chicago-ps1-facades-r21.test.cjs
      - name: R22 certificar conexões dos corredores PS1, margens e radar
        run: node --test tests/chicago-r22-source-street-network.test.cjs
      - name: R23 verificar seis arestas originais, escala e emenda à R20
        run: node --test tests/chicago-r23-source-extension.test.cjs
      - name: R25 verificar ramificação leste, largura e origem da malha PS1
        run: node --test tests/chicago-r25-eastern-fork.test.cjs
      - name: Certificar desempenho e descarte de chunks
        run: node --test tests/district-visibility.test.cjs
      - name: Certificar Driving Games, missões de Vegas e Rio e spatial hash
        run: node --test tests/arcade-regional-expansion.test.cjs
      - name: Certificar pavimentação Driver 2 e cruzamentos nos 4 mapas
        run: node --test tests/road-surface-style.test.cjs
      - name: Testar integridade da GPU em trocas de veículos GLB
        run: node --test tests/gpu-resource-lifecycle.test.cjs
      - name: Instalar Chromium e Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar geometria, entradas e portões (sem navegador)
        run: node tests/structure-smoke.cjs
      - name: Testar piso elevado, meio-fio e travessias nas quatro cidades
        run: node tests/pedestrian-curb-smoke.cjs
      - name: Testar pedestre feminina, animação e GLB
        run: node tests/female-walker-smoke.cjs
      - name: Validar o GLB masculino original, caminhada, corrida e troca de mapa
        run: node --test tests/male-pedestrian-glb.test.cjs
      - name: Servir a versão atual do jogo
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/driver-http.log 2>&1 &
          echo $! > /tmp/driver-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/driver-http.log
          exit 1
      - name: R22 dirigir pelo acesso norte e certificar radar da Chicago
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r22-source-street-browser.cjs
      - name: R23 dirigir por via candidata com controle real e sem teleporte
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r23-source-driving-browser.cjs
      - name: R25 percorrer a bifurcação PS1 e validar carro, água e colisões
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r25-eastern-fork-browser.cjs
      - name: R35 dirigir pela nova ligação norte
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r35-north-link-browser.cjs
      - name: R36 dirigir pela continuação norte
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r36-north-link-browser.cjs
      - name: R37 dirigir pelo ramal norte
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r37-north-branch-browser.cjs
      - name: Validar cinco modelos de pedestres e troca Chicago/Havana
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/male-pedestrian-visual.cjs
      - name: Validar carregamento do mapa original de Chicago na raiz
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-root-preview-visual.cjs
      - name: R7 conferir curvas visuais de Goose Island sem água ou colisores
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r7-junctions-browser.cjs
      - name: R7 dirigir fisicamente por 35-80 segundos simulados sem teletransporte
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r7-real-driving-replay.cjs
      - name: R6 validar galpões norte, ponte sobre o canal e saída segura
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r6-north-yard-browser.cjs
      - name: R5 verificar acesso de veículo vindo do continente e saída norte da ilha
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r5-visitor-browser.cjs
      - name: R4 testar primeira rua fora da grade, tráfego da ilha e saída pelas pontes
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r4-island-browser.cjs
      - name: R3 validar ausência de asfalto, faixas e zebras sobre canais
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r3-streets-browser.cjs
      - name: Certificar Goose Island, os dois braços do Rio Chicago e pontes no Undercover
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-ps1-undercover-river-r2-visual.cjs
      - name: Certificar Undercover com Lago Michigan sem quebrar pontes e missão
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-ps1-undercover-visual.cjs
      - name: Jogar e testar os 10 modos da expansão no Chromium
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/expansion-visual-smoke.cjs
      - name: Abrir e testar todos os mapas no navegador
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/visual-smoke.cjs
      - name: Publicar screenshots e FPS de diagnóstico
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver2-qa-four-cities
          path: qa-artifacts/
          retention-days: 14
