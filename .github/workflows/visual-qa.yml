name: Driver 2 - QA visual das quatro cidades

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'js/world/**'
      - 'tests/visual-smoke.cjs'
      - 'tests/structure-smoke.cjs'
      - 'tests/female-walker-smoke.cjs'
      - 'js/assets/driver-female-pedestrian.js'
      - 'js/entities/pedestrians-roadblocks.js'
      - 'assets/pedestrians/**'
      - '.github/workflows/visual-qa.yml'

permissions:
  contents: read

jobs:
  four-city-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium e Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar geometria, entradas e portões (sem navegador)
        run: node tests/structure-smoke.cjs
      - name: Testar pedestre feminina, animação e GLB
        run: node tests/female-walker-smoke.cjs
      - name: Servir a versão atual do jogo
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/driver-http.log 2>&1 &
          echo $! > /tmp/driver-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/driver-http.log
          exit 1
      - name: Abrir e testar todos os mapas no navegador
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/visual-smoke.cjs
      - name: Publicar screenshots e FPS de diagnóstico
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver2-qa-four-cities
          path: qa-artifacts/
          retention-days: 14
