name: Driver 2 - R60 playtest Game Forge P0
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/playtest-gameforge-p0.cjs'
      - 'tests/city-home-save.test.cjs'
      - 'js/gameplay/home-save.js'
      - 'js/world/city-builder.js'
      - 'js/vehicles/driver-vehicle.js'
      - '.github/workflows/gameforge-playtest.yml'
  pull_request:
    paths:
      - 'tests/playtest-gameforge-p0.cjs'
      - 'tests/city-home-save.test.cjs'
      - 'js/gameplay/home-save.js'
      - 'js/world/city-builder.js'
      - 'js/vehicles/driver-vehicle.js'
      - '.github/workflows/gameforge-playtest.yml'
permissions:
  contents: read
jobs:
  gameforge-p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run save and train physics regressions
        run: node --test tests/city-home-save.test.cjs tests/urban-water-garage.test.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start real static game server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/driver2-playtest-http.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/driver2-playtest-http.log
          exit 1
      - name: Keyboard driving, walking, save reload and station underpass
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/playtest-gameforge-p0.cjs
      - name: Upload before-after screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver2-gameforge-playtest-evidence
          path: qa-artifacts/gameforge-*
          retention-days: 14
