name: Chicago R78 - sequential blocks and real interiors
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/world/chicago-block-generator-r78.js'
      - 'js/world/chicago-city-plan.js'
      - 'js/world/city-builder.js'
      - 'index.html'
      - 'tests/chicago-r78-*.cjs'
      - '.github/workflows/chicago-r78.yml'
      - 'CHICAGO_CONTINUIDADE_R78.md'
  push:
    branches: [main]
    paths:
      - 'js/world/chicago-block-generator-r78.js'
      - 'js/world/chicago-city-plan.js'
      - 'js/world/city-builder.js'
      - 'index.html'
      - 'tests/chicago-r78-*.cjs'
permissions:
  contents: read
jobs:
  pilot-blocks-and-accessible-rooms:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and generation regression
        run: |
          node --check js/world/chicago-block-generator-r78.js
          node --check js/world/chicago-city-plan.js
          node --check js/world/city-builder.js
          node --test tests/chicago-r78-sequential-blocks.test.cjs tests/chicago-city-plan.test.cjs tests/chicago-r68-rooflines.test.cjs tests/chicago-r69-courtyard-network.test.cjs tests/chicago-r77-playable-landmarks.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve full playable Driver 2
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/r78-http.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/r78-http.log
          exit 1
      - name: Verify real doors/interiors, buildings, collisions and 4 city invariants
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r78-playable-browser.cjs
      - name: Archive in-game evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-r78-sequential-blocks-playable
          path: qa-artifacts/chicago-r78/
          if-no-files-found: warn
