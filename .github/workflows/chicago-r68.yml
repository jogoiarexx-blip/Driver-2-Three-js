name: Chicago R68 - road footprints and rooftop visual smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/world/chicago-city-plan.js'
      - 'js/world/chicago-landmark-district-r57.js'
      - 'tests/chicago-r68*'
      - 'tests/chicago-r57-landmark-district.test.cjs'
      - '.github/workflows/chicago-r68.yml'
  push:
    branches: [main]
    paths:
      - 'js/world/chicago-city-plan.js'
      - 'js/world/chicago-landmark-district-r57.js'
      - 'tests/chicago-r68*'
permissions:
  contents: read
jobs:
  chicago-real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dry roads, grades and roof parcel boundaries
        run: |
          node --check tests/chicago-r68-browser.cjs
          node --test tests/chicago-r57-landmark-district.test.cjs tests/chicago-r68-rooflines.test.cjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve local game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/r68-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/r68-http.log
          exit 1
      - name: Verify Chicago roads and rooftops with actual Three.js in Chromium
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r68-browser.cjs
      - name: Evidence - Chicago screenshot and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-r68-roads-rooflines
          path: |
            qa-artifacts/chicago-r68-*
          if-no-files-found: ignore
