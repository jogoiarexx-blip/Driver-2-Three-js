name: Driver 2 - Chicago R44 - quadra oeste paralela

on:
  workflow_dispatch:
  push:
    paths:
      - 'chicago/reference-parallel-west-r44.*'
      - 'js/world/chicago-parallel-west-r44.js'
      - 'tests/chicago-r44-parallel-west*'
      - '.github/workflows/chicago-r44-parallel-west.yml'

permissions:
  contents: read

jobs:
  source-and-physical-drive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar 10 arestas da referência, ligações e segunda quadra
        run: node --test tests/chicago-r44-parallel-west.test.cjs
      - name: Preparar Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Servir Driver 2 localmente
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/driver-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Dirigir R44 nos dois sentidos e verificar pavimento e colisões
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r44-parallel-west-browser.cjs
      - name: Arquivar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-r44-qa
          path: qa-artifacts/
          retention-days: 14
