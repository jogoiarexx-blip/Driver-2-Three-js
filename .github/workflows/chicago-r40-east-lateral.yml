name: Driver 2 - Chicago R40 - transversal leste

on:
  workflow_dispatch:
  push:
    paths:
      - 'chicago/reference-east-lateral-r40.*'
      - 'js/world/chicago-east-lateral-r40.js'
      - 'js/world/chicago-ps1-street-network-r22.js'
      - 'js/world/city-builder.js'
      - 'tests/chicago-r40-east-lateral*'
      - '.github/workflows/chicago-r40-east-lateral.yml'

permissions:
  contents: read

jobs:
  source-and-physical-drive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar 32 arestas fonte, encaixe R39 e isolamento
        run: node --test tests/chicago-r40-east-lateral.test.cjs
      - name: Preparar Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Iniciar versão local da cidade
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/driver-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Dirigir R40 nos dois sentidos sem teleporte
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r40-east-lateral-browser.cjs
      - name: Publicar registros do percurso
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-r40-east-lateral-qa
          path: qa-artifacts/
          retention-days: 14
