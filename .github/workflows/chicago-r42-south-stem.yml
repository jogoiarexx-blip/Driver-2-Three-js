name: Driver 2 - Chicago R42 - ramal sul

on:
  workflow_dispatch:
  push:
    paths:
      - 'chicago/reference-south-stem-r42.*'
      - 'js/world/chicago-south-stem-r42.js'
      - 'tests/chicago-r42-south-stem*'
      - '.github/workflows/chicago-r42-south-stem.yml'

permissions:
  contents: read

jobs:
  source-and-drive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar oito arestas originais e geometria do entroncamento
        run: node --test tests/chicago-r42-south-stem.test.cjs
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Disponibilizar Driver 2 em localhost
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/driver-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Dirigir ida e volta por R42 sem teletransporte
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r42-south-stem-browser.cjs
      - name: Preservar registros do QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-r42-south-stem-qa
          path: qa-artifacts/
          retention-days: 14
