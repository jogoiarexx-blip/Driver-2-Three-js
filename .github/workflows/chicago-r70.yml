name: Chicago R70 - bascule bridges and road height
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/traffic/chicago-mixed-navigation-r49.js'
      - 'tests/chicago-r70*'
      - '.github/workflows/chicago-r70.yml'
  push:
    branches: [main]
    paths:
      - 'js/traffic/chicago-mixed-navigation-r49.js'
      - 'tests/chicago-r70*'
permissions:
  contents: read
jobs:
  real-chicago-bridges:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Chicago grade and bascule graph transitions
        run: |
          node --check js/traffic/chicago-mixed-navigation-r49.js
          node --check tests/chicago-r70-browser.cjs
          node --test tests/chicago-r70-bridge-grade.test.cjs tests/chicago-r49-mixed-navigation.test.cjs tests/chicago-r69-courtyard-network.test.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve local static game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/r70-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/r70-http.log
          exit 1
      - name: Validate both bascules and fixed river bridge using real Chicago Three.js
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r70-browser.cjs
      - name: Export screenshot and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-r70-road-levels
          path: |
            qa-artifacts/chicago-r70-*
          if-no-files-found: ignore
