name: Chicago R81 - Real Goose Island industrial yards and office
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/world/chicago-goose-industrial-r81.js'
      - 'js/world/city-builder.js'
      - 'js/traffic/chicago-mixed-navigation-r49.js'
      - 'index.html'
      - 'tests/chicago-r81-*.cjs'
      - '.github/workflows/chicago-r81.yml'
      - 'CHICAGO_CONTINUIDADE_R78.md'
  push:
    branches: [main]
    paths:
      - 'js/world/chicago-goose-industrial-r81.js'
      - 'js/world/city-builder.js'
      - 'js/traffic/chicago-mixed-navigation-r49.js'
      - 'index.html'
      - 'tests/chicago-r81-*.cjs'
permissions:
  contents: read
jobs:
  industrial-yards-and-office:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript and Chicago source safety/physics
        run: |
          node --check js/world/chicago-goose-industrial-r81.js
          node --check js/world/city-builder.js
          node --check js/traffic/chicago-mixed-navigation-r49.js
          node --test tests/chicago-r81-industrial-yards.test.cjs tests/chicago-r80-riverfront.test.cjs tests/chicago-r79-downtown-streets.test.cjs tests/chicago-r78-sequential-blocks.test.cjs tests/chicago-r53-west-canal.test.cjs tests/chicago-ps1-river-branches.test.cjs tests/chicago-r77-playable-landmarks.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve full Driver 2 game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/r81-http.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/r81-http.log
          exit 1
      - name: Full game — two truck yards, real warehouse office, route continuity
        env:
          DRIVER_QA_URL: http://127.0.0.1:4173/
        run: node tests/chicago-r81-playable-browser.cjs
      - name: Archive screenshot and route/interior evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-r81-goose-industrial-game
          path: qa-artifacts/chicago-r81/
          if-no-files-found: warn
